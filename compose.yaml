services:
  front:
    build:
      context: ./front
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - back

  back:
    build:
      context: ./back
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./back:/app
      - back_node_modules:/app/node_modules
    ports:
      - "3000:3000"

volumes:
  front_node_modules:
  back_node_modules:
