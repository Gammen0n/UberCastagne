services:
  front:
    build:
      context: ./front
    working_dir: /app
    # Install first: the node_modules volume would otherwise keep an outdated set of packages.
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    environment:
      API_URL: http://back:3000
      WATCH_POLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      - back

  back:
    build:
      context: ./back
    working_dir: /app
    # Install first: the node_modules volume would otherwise keep an outdated set of packages.
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./back:/app
      - back_node_modules:/app/node_modules
    environment:
      PGHOST: postgres
      PGPORT: 5432
      CATALOGUE_DB_PASSWORD: ${CATALOGUE_DB_PASSWORD:?copier .env.example en .env}
      VENUES_DB_PASSWORD: ${VENUES_DB_PASSWORD:?copier .env.example en .env}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copier .env.example en .env}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?copier .env.example en .env}
      CATALOGUE_DB_PASSWORD: ${CATALOGUE_DB_PASSWORD:?copier .env.example en .env}
      VENUES_DB_PASSWORD: ${VENUES_DB_PASSWORD:?copier .env.example en .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?copier .env.example en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/sql:/sql:ro
    # Exposé uniquement sur la machine locale, pour inspecter les bases en développement.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  front_node_modules:
  back_node_modules:
  postgres_data:
